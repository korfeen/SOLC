<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ogre Dream Run</title>
<style>
:root{--bg:#17130f;--panel:#24180f;--line:#4a3420;--text:#efe2c6;--muted:#b9a582;--gold:#f2c14e;--velvet:#6b1a21;
  --uncommon:#3fbf4a;--rare:#3a8ee6;--epic:#b04ef0;--legendary:#ff8a1a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.35 Georgia,serif;display:flex;flex-direction:column;overflow:hidden}
#bar{display:flex;gap:12px;align-items:center;padding:6px 12px;background:#1f150d;border-bottom:1px solid var(--line)}
#bar h1{margin:0;font-size:17px;color:var(--gold);font-weight:400}
#bar select,#bar button{font:13px Georgia,serif;color:var(--text);background:#120d09;border:1px solid var(--line);border-radius:4px;padding:2px 6px}
#bar .keys{color:var(--muted);margin-left:auto}
#app{flex:1;display:flex;min-height:0}
#side{width:300px;padding:10px;background:#1b130c;border-right:1px solid var(--line);overflow:auto}
.frame{background:linear-gradient(#6b4a22,#3d2810);padding:9px;border-radius:6px;box-shadow:inset 0 0 0 2px #c9a14a,0 4px 14px #000a}
#square{display:block;width:100%;aspect-ratio:1;background:#2a2016;border-radius:2px}
.slot{display:flex;align-items:center;gap:6px;margin:5px 0}
.slot .ln{width:62px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.slot .pn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvbar{width:54px;height:6px;background:#3a2a1a;border-radius:3px;overflow:hidden}.lvbar i{display:block;height:100%;background:var(--gold)}.lvn{width:38px;text-align:right;font-size:11px;color:var(--muted)}.pips{display:flex;gap:2px}.pips i{width:7px;height:7px;border-radius:50%;background:#3a2a1a;display:block}.pips i.on{background:var(--gold)}
.uncommon{color:var(--uncommon)}.rare{color:var(--rare)}.epic{color:var(--epic)}.legendary{color:var(--legendary)}
h3{margin:12px 0 4px;color:var(--gold);font-weight:400;font-size:14px;border-bottom:1px solid var(--line)}
.set{font-size:12px;color:var(--muted)}.set b{color:var(--text)}.set.on b{color:var(--uncommon)}
.stats{font-size:12px;color:var(--muted)}
#hpbar{height:10px;background:#3a1a14;border-radius:5px;overflow:hidden;margin-top:8px}#hpbar div{height:100%;background:#d24a3c;width:100%}
#wrap{flex:1;position:relative;min-width:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:6px 12px;display:flex;gap:18px;align-items:center;font-size:15px;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none}
#xp{position:absolute;left:0;right:0;top:0;height:6px;background:#0008}#xp div{height:100%;background:#5fb4ff;width:0}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;flex-direction:column;gap:14px}
.hidden{display:none}
.ov h2{margin:0;color:var(--gold);font-weight:400;font-size:30px;letter-spacing:.08em;text-shadow:0 2px 0 #000}
.cards{display:flex;gap:16px}
.card{width:210px;background:#f4ead2;color:#2a1c10;border-radius:6px;padding:10px;cursor:pointer;box-shadow:0 6px 18px #000c;transform:rotate(var(--r));transition:transform .12s}
.card:hover{transform:rotate(0) scale(1.05)}
.card .tag{font-size:11px;letter-spacing:.08em;color:#7a5a30}.card .tag b{color:#b0301e}
.card canvas{display:block;width:150px;height:150px;margin:6px auto}
.card .nm{font-size:16px;text-align:center}.card .what{font-size:12px;margin-top:4px;color:#4a3a28}.card .st{font-size:12px;margin-top:4px;color:#2f6e2a}
.card .nm.uncommon{color:#23852b}.card .nm.rare{color:#1d63b0}.card .nm.epic{color:#7e2fb3}.card .nm.legendary{color:#c0610a}
.card .key{float:right;color:#9a8060}
.btn{font:16px Georgia,serif;padding:6px 18px;background:var(--velvet);color:var(--gold);border:1px solid var(--gold);border-radius:5px;cursor:pointer}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:22px;color:var(--gold);text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;opacity:0;transition:opacity .3s}
</style></head><body>
<div id="bar"><h1>Ogre Dream Run</h1>
  <label>Stage <select id="stageSel"></select></label>
  <label>Angle <select id="angleSel"><option value="low">low</option><option value="mid" selected>mid</option><option value="high">high</option></select></label>
  <label>Foes <select id="foeSel"><option value="painted">painted</option><option value="crayon">crayon</option><option value="mix" selected>mix</option></select></label>
  <button id="restart">New run</button>
  <span class="keys">WASD / arrows move · 1-5 pick · C crayon/painted you · P pause</span></div>
<div id="app">
  <div id="side">
    <div class="frame"><canvas id="square" width="560" height="560"></canvas></div>
    <div id="hpbar"><div></div></div>
    <div id="slots"></div>
    <h3>Sets</h3><div id="sets"></div>
    <h3>Stats</h3><div class="stats" id="stats"></div>
  </div>
  <div id="wrap"><canvas id="stage"></canvas>
    <div id="xp"><div></div></div>
    <div id="hud"><span id="time">0:00</span><span id="lvl">LV 1</span><span id="kills">0 BONK</span><span id="you" style="margin-left:auto"></span></div>
    <div id="toast"></div><pre id="errs" style="display:none;position:absolute;left:8px;bottom:8px;max-width:70%;white-space:pre-wrap;background:#300c;color:#fbb;font:11px monospace;padding:6px;border-radius:4px;z-index:5"></pre>
    <div id="pick" class="ov hidden"><h2 id="pickTitle">PICK!</h2><div class="cards" id="cards"></div></div>
    <div id="over" class="ov hidden"></div>
    <div id="loading" class="ov"><h2>Drawing the dream...</h2></div>
  </div>
</div>
<script>
// ---------------------------------------------------------------------------------------------------------------------
// Tunables
const MOCK_TIME = location.search.includes("quick") ? 0.5 : 1;  // (?quick: the arcade's boss times at half, to try it quicker; user found the early game too hard with it on)                         // (the mockup runs the arcade's boss times at half, to try it quicker)
const WORLD = { x: 3600, z: 2200 };  // (a room may have its own size: stage.rooms[].layout.size - the Library is two screens deep)
const WORLD0 = { ...WORLD };            // the stage floor (x across, z away from you)
const OGRE_H = 150, HAT_Y = 118;  // world heights
const LAYERS = ["headwear", "outfit", "accessory", "eyes", "expression"];
const LNAME = { headwear: "Hat", outfit: "Outfit", accessory: "Accessory", eyes: "Eyes", expression: "Mouth" };
const UNDER_HAT = new Set(["gold_chain", "moonstone_pendant", "eye_mask_pushed_up", "sleep_mask", "monocle", "pirate_eyepatch", "cucumber_slices"]);
const ENEMY_SKINS = ["moss", "mud_brown", "swamp_green", "slate_gray", "sunburnt_red", "pale_lavender"];
// The stages: dungeons (tools/arcade-stages.json, filled in at the start): their painting, foes and three bosses.
let ARCADE, STAGES = {};
let MAX_LV = 20;  // (a slot's top level: gear.json rules.maxLevel)
const RARITY_W = { uncommon: 50, rare: 30, epic: 15, legendary: 5 };

// ---------------------------------------------------------------------------------------------------------------------
let PROPS = [];  // the rooms' painted props on disk (gravestones...; tools/gen-arcade-props.js)
let G, POOL, P, GEN = new Set();  // gear.json, offerable pieces, pieces by id, every painted piece on disk (built or not)
const $ = (id) => document.getElementById(id);
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Pictures: layers (1254 squares) composed into a paper cutout - cropped to what's drawn, a white paper edge round it.
const imgs = {};
// (kept shrunk: a 1254 picture is ~6 MB decoded, and a run loads hundreds - that ate the browser's memory)
function loadImg(url, size = 512) {
  const key = url + "@" + size;
  if (!imgs[key]) imgs[key] = new Promise((ok) => {
    const i = new Image();
    i.onload = () => { const c = mk(size, size); c.getContext("2d").drawImage(i, 0, 0, size, size); i.src = ""; ok(c); };
    i.onerror = () => ok(null);
    i.src = url;
  });
  return imgs[key];
}
const artUrl = (ed, id, skin) => `/art/${ed}/${id}.png${skin ? "?skin=" + skin : ""}`;
const comps = {};
// look = { skin, headwear, outfit, accessory, eyes, expression, suit }; ed = painted | crayon (crayon falls back to painted per layer)
function lookLayers(look, ed) {
  const L = [];
  const add = (id, perSkin) => { if (id) L.push({ id, perSkin }); };
  add(look.skin);
  add(look.outfit);
  add(look.expression || "smug_smile", true);
  add(look.eyes || "heavy_bags", true);
  if (look.accessory && UNDER_HAT.has(look.accessory)) add(look.accessory);
  add(ed === "crayon" ? look.headwear : (look.suit || look.headwear));
  if (look.accessory && !UNDER_HAT.has(look.accessory)) add(look.accessory);
  return L.map((l) => ({ ...l, ed: ed === "crayon" && (l.id === look.skin || (POOL.byId[l.id] && POOL.byId[l.id].crayon)) ? "crayon" : "painted" }));
}
function compose(look, ed, edge = 5) {
  const key = JSON.stringify([look, ed, edge]);
  if (!comps[key]) comps[key] = (async () => {
    const layers = Array.isArray(look) ? look : lookLayers(look, ed);
    const ims = await Promise.all(layers.map((l) => loadImg(artUrl(l.ed || ed, l.id, l.perSkin ? look.skin : null))));
    const R = 380, c = mk(R, R), g = c.getContext("2d");
    for (const im of ims) if (im) g.drawImage(im, 0, 0, R, R);
    const d = g.getImageData(0, 0, R, R).data;
    let x0 = R, y0 = R, x1 = -1, y1 = -1;
    for (let y = 0; y < R; y++) for (let x = 0; x < R; x++) if (d[(y * R + x) * 4 + 3] > 30) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) return null;
    const pad = edge + 3, w = x1 - x0 + 1 + pad * 2, h = y1 - y0 + 1 + pad * 2;
    const cut = mk(w, h);
    cut.getContext("2d").drawImage(c, x0 - pad, y0 - pad, w, h, 0, 0, w, h);
    const ring = (r, color) => {
      const s = mk(w, h), sg = s.getContext("2d");
      for (let a = 0; a < 16; a++) sg.drawImage(cut, Math.cos(a / 16 * 6.283) * r, Math.sin(a / 16 * 6.283) * r);
      sg.globalCompositeOperation = "source-in"; sg.fillStyle = color; sg.fillRect(0, 0, w, h);
      return s;
    };
    const out = mk(w, h), og = out.getContext("2d");
    if (edge) { og.drawImage(ring(edge + 1.5, "rgba(70,45,20,.6)"), 0, 0); og.drawImage(ring(edge, "#fbf6ea"), 0, 0); }
    og.drawImage(cut, 0, 0);
    return { canvas: out, aspect: w / h, full: c, box: [x0, y0, x1, y1] };
  })();
  return comps[key];
}

// ---------------------------------------------------------------------------------------------------------------------
// The run
let S;  // state
const keys = {};
function newRun() {
  const stageId = $("stageSel").value, skin = "moss";
  S = {
    stageId, stage: STAGES[stageId], t: 0, kills: 0, level: 1, xp: 0, need: 7, paused: false, over: false, picking: false,
    you: { x: WORLD.x / 2, z: 260, hp: 100, maxHp: 100, face: 1, flip: 1, moving: false, aim: { x: 1, z: 0 }, hitT: 0 },
    look: { skin }, lv: {}, cds: {}, echo: {}, pivot: {}, smug: {}, smugT: {}, starKills: 0, foes: [], shots: [], eshots: [], decals: [], gems: [], drops: [], floats: [], spawnT: 0, bossOut: false,
    yourCut: null, squarePop: 0, crayon: S ? S.crayon : true, cam: { x: WORLD.x / 2, z: 260 - 900 },
  };
  prepStage();
  pickMint();
}
// Your pictures are the save files: pick one (its skin is your class), then one of its pieces to start with.
// (Sample pictures here, made of random pieces; in the game: your own mints.)
function samplePiece(layer) {
  const opts = POOL.list.filter((x) => P[x.id].layer === layer);
  let tot = 0; const w = opts.map((o) => (tot += RARITY_W[P[o.id].rarity], RARITY_W[P[o.id].rarity]));
  let x = Math.random() * tot, i = 0; while ((x -= w[i]) > 0) i++;
  return opts[i].id;
}
function pickMint() {
  const skins = Object.keys(P).filter((id) => P[id].role === "character");
  const mints = Array.from({ length: 4 }, () => {
    const m = { skin: pick(skins) };
    do { for (const l of LAYERS) if (l === "headwear" || l === "outfit" || Math.random() < 0.8) m[l] = samplePiece(l); }
    while (!LAYERS.some((l) => m[l] && P[m[l]].role === "attack"));
    return m;
  });
  S.picking = true; S.mints = mints; S.cards = null;
  $("pickTitle").textContent = "PICK A PICTURE";
  const box = $("cards"); box.innerHTML = "";
  mints.forEach((m, i) => {
    const el = document.createElement("div");
    el.className = "card"; el.style.setProperty("--r", (i - 1.5) * 2 + "deg");
    el.innerHTML = `<div class="tag"><b>PICTURE</b> #${100 + Math.floor(Math.random() * 900)}<span class="key">${i + 1}</span></div><canvas width="300" height="300" style="width:180px;height:180px"></canvas>` +
      `<div class="nm ${P[m.skin].rarity}">${P[m.skin].name}</div><div class="what">${P[m.skin].perk}</div>`;
    el.onclick = () => chooseMint(m);
    box.appendChild(el);
    compose(m, "painted", 0).then((cut) => {
      const g = el.querySelector("canvas").getContext("2d");
      if (S.backdrop) g.drawImage(S.backdrop, 0, 0, 300, 300); else { g.fillStyle = "#2a2016"; g.fillRect(0, 0, 300, 300); }
      if (cut) g.drawImage(cut.full, 0, 0, 300, 300);
    });
  });
  $("pick").classList.remove("hidden");
}
function chooseMint(m) {
  if (!S.mints) return;
  S.mints = null; S.mint = m; S.look.skin = m.skin;
  // (?wear=id,id: a test switch - those pieces on from the start)
  for (const id of (new URLSearchParams(location.search).get("wear") || "").split(",")) if (P[id]) { S.look[P[id].layer] = id; S.lv[P[id].layer] = 1; }
  // (?pfx=double,hothead...: a test switch - those pivot effects on the weapon from the start)
  for (const k of (new URLSearchParams(location.search).get("pfx") || "").split(",")) if (k) { const pv = (S.pivot.accessory = S.pivot.accessory || { effects: {} }); pv.effects = pv.effects || {}; pv.effects[k] = 1; }
  refreshYou();
  // (only the picture's attacks: a run never starts on a passive)
  showCards(LAYERS.filter((l) => m[l] && P[m[l]].role === "attack").map((l) => ({ kind: "new", layer: l, id: m[l] })), "START WITH ONE");
}
function stats() {
  const st = {};
  const add = (o, m = 1) => { for (const [k, v] of Object.entries(o || {})) st[k] = (st[k] || 0) + v * m; };
  add((P[S.look.skin] || {}).stats);
  for (const l of LAYERS) if (S.look[l]) add(P[S.look[l]].stats, (1 + (S.lv[l] - 1) * 0.25) * (1 + ((S.pivot && S.pivot[l] && S.pivot[l].stats) || 0)));
  for (const s of activeSets()) for (const b of s.on) add(b.stats);
  return st;
}
function activeSets() {
  const by = {};
  for (const l of LAYERS) {
    const id = S.look[l]; if (!id) continue;
    const p = P[id]; if (!p.set) continue;
    if (!(["headwear", "outfit", "accessory"].includes(l) || p.item)) continue;
    (by[p.set] = by[p.set] || new Set()).add(l);
  }
  return Object.entries(by).map(([sid, ls]) => {
    const set = G.sets.find((x) => x.id === sid);
    const n = ls.size;
    return { set, n, on: (set.bonuses || []).filter((b) => b.at && b.at <= n && (b.stats || b.vs || b.regen || b.fluff)) };
  }).filter((x) => x.set);
}

// The stage: floor and sky colours from the painting.
async function painting(id) {
  const im = await loadImg(artUrl("painted", id), 1024);
  const c = mk(8, 8), g = c.getContext("2d");
  if (im) g.drawImage(im, 0, 0, 8, 8);
  const avg = (y0, y1) => { const d = g.getImageData(0, y0, 8, y1 - y0).data; let r = 0, gg = 0, b = 0, n = d.length / 4; for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; } return [r / n, gg / n, b / n]; };
  return { im, floorRGB: avg(6, 8), skyRGB: avg(0, 2) };
}
function usePainting(p) { S.backdrop = p.im; S.floorRGB = p.floorRGB.slice(); S.skyRGB = p.skyRGB; S.floorImg = p.floor || null; }
async function prepStage() {
  // (a dungeon whose rooms are places of their own - Scarlet Monastery's wings - has a painting per room)
  S.roomArt = S.stage.rooms ? await Promise.all(S.stage.rooms.map(async (r) => ({ ...(await painting(r.stage)), floor: await loadFloor(r.floor || (r.layout && r.layout.floor)) }))) : null;
  usePainting(S.roomArt ? S.roomArt[0] : await painting(S.stage.stage));
  S.propCuts = await loadProps();
  // the foes' looks, ready before they walk in
  const looks = [];
  // the dungeon's real mobs (stage.mobs): each its costume (or a stand-in), the item it holds, its tint and size
  for (const [mi, m] of (S.stage.mobs || []).entries()) for (const tier of ["grunt", "brute"]) for (const skin of ENEMY_SKINS.slice(0, 2)) {
    const look = mobLook(m, tier, skin);
    if (look) looks.push({ kind: m.costume, mob: m, mi, tier, look, cut: compose(look, "painted"), cutC: compose(look, "crayon") });
  }
  for (const kind of (S.stage.mobs ? [] : S.stage.foes).concat(S.stage.whelps || [])) for (const tier of ["grunt", "brute"]) for (const skin of ENEMY_SKINS.slice(0, 3)) {
    const look = { skin, eyes: pick(["heavy_bags", "fully_asleep", "single_eye_open", "bloodshot"]), expression: pick(["smug_smile", "mouth_hanging_open", "drooling"]) };
    // a creature costume (crit_), or a faction's outfit (fac_: Defias, Scarlet, Dark Iron...; no hooded suit)
    const pre = P[`crit_${kind}_head`] ? "crit" : "fac";
    look.headwear = `${pre}_${kind}_head`;
    if (tier !== "grunt") { look.outfit = `${pre}_${kind}_body`; if (pre === "crit") look.suit = `crit_${kind}_suit`; }
    looks.push({ kind, tier, look, cut: compose(look, "painted"), cutC: compose(look, "crayon") });
  }
  // the rooms' bosses on their room's back wall: one in the middle, or two side by side (the first smaller); one who
  // comes in after another ("enter": "after" - Whitemane) waits out of sight
  const ed = $("foeSel").value === "crayon" ? "crayon" : "painted";
  const bosses = S.stage.bosses.map((b, i) => {
    const look = bossLook(b, i);
    return { ...b, i, room: b.room ?? i, look, cut: compose(look, ed), state: b.enter === "after" ? "hidden" : "wall", x: WORLD.x * 0.5, z: WORLD.z - 40, y: 0, wallX: 0, wallS: 1 };
  });
  for (const r of new Set(bosses.map((b) => b.room))) {
    const on = bosses.filter((b) => b.room === r && b.state === "wall");
    if (on.length === 2) { on[0].wallX = -0.2; on[0].wallS = 0.78; on[1].wallX = 0.17; }
  }
  for (const b of bosses) { b.cut = await b.cut; if (b.partner) b.partnerCut = await compose(b.partner.look, ed); }
  S.bosses = bosses;  // (only once their pictures are drawn)
  S.room = 0; S.bi = 0; S.wake = 0; S.wakeKills = 0; S.hole = null; S.holes = [];
  layRoom();
  for (const f of looks) { f.cut = await f.cut; f.cutC = (await f.cutC) || f.cut; if (f.mob && f.mob.tint) { f.cut = tinted(f.cut, f.mob.tint); f.cutC = tinted(f.cutC, f.mob.tint); } }
  S.foeLooks = looks.filter((f) => f.cut);
  $("loading").classList.add("hidden");
}
async function refreshYou() {
  const look = { ...S.look };
  S.yourCut = await compose(look, S.crayon ? "crayon" : "painted");
  // (Polymorph: your own ogre in the Counting Sheep onesie and nightcap, no weapon - user: a sheep costume when he's sheeped)
  S.sheepYou = await compose({ ...look, headwear: "plan_sheep_nightcap", outfit: "plan_sheep_onesie", accessory: undefined, suit: undefined }, S.crayon ? "crayon" : "painted");
  const sq = await compose(look, "painted", 0);
  drawSquare(sq);
  // (each attack throws or swings the piece's own picture, in the edition you're drawn in)
  const ed1 = (id) => S.crayon && POOL.byId[id] && POOL.byId[id].crayon ? "crayon" : "painted";
  const one = (id, perSkin) => id ? compose(Object.assign([{ id, ed: ed1(id), perSkin, skinTag: look.skin }], { skin: look.skin }), "painted", 3) : null;
  [S.hatCut, S.accCut, S.sheepCut] = await Promise.all([one(look.headwear), one(look.accessory), S.sheepCut || one("floating_sheep")]);  // (the flock's sheep)
  renderSide();
}
function drawSquare(sq) {
  S.lastSquare = sq;
  const c = $("square"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const bg = S.backdrop;
  if (bg) { g.globalAlpha = 0.9; g.drawImage(bg, 0, 0, c.width, c.height); g.globalAlpha = 1; }
  if (sq) g.drawImage(sq.full, 0, 0, c.width, c.height);
  S.squarePop = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// Picks
function offer(first) {
  const cards = [], used = new Set();
  const empties = LAYERS.filter((l) => !S.look[l]);
  const newPiece = (layer) => {
    const opts = POOL.list.filter((x) => P[x.id].layer === layer && x.id !== S.look[layer] && !used.has(x.id));
    if (!opts.length) return null;

  for (const e of S.eshots || []) all.push({ z: e.z, f: () => drawEShot(e) });

  for (const d of S.drops) all.push({ z: d.z, f: async () => {
    d.c = d.c || (await d.cut);
    billboard(d.c, d.x, 20 + Math.sin(S.t * 3) * 8, d.z, 70, Math.cos(S.t * 2.5), 0, Math.min(1, (d.life ?? 25) / 4));  // (fading out at the end)
    if (S.nearDrop === d) { const h = proj(d.x, 110, d.z); if (h) { ctx.font = `bold ${Math.round(20 * Math.max(0.7, h.s))}px Georgia`; ctx.textAlign = "center"; ctx.fillStyle = "#ffe9a8"; ctx.strokeStyle = "#000"; ctx.lineWidth = 3; const t = `E: ${P[d.id].name}`; ctx.strokeText(t, h.x, h.y); ctx.fillText(t, h.x, h.y); ctx.textAlign = "start"; } }
  } });
  for (const s of S.shots) all.push({ z: s.z, f: () => {
    if (s.z - S.cam.z < NEAR) return;

      if (s.type === "held") ctx.scale(s.dir.x < 0 ? -1 : 1, 1);

    }
    if (s.type === "pet" && s.cut) { floorEllipse(s.x, s.z, 20, "rgba(0,0,0,.25)"); billboard(s.cut, s.x, Math.abs(Math.sin(S.t * 14)) * 10, s.z, s.size, s.face || 1); return; }
    const p = proj(s.x, s.y || 70, s.z); if (!p) return;
    if (s.type === "star") { ctx.fillStyle = "#ffe25a"; ctx.strokeStyle = "#7a5a10"; ctx.lineWidth = 3; ctx.font = `bold ${Math.round(70 * p.s)}px Georgia`; ctx.textAlign = "center"; ctx.strokeText("★", p.x, p.y); ctx.fillText("★", p.x, p.y); ctx.textAlign = "start"; return; }

  // beams over everything

    const a = proj(d.a.x, d.a.y, d.a.z), b = proj(d.b.x, 70, d.b.z); if (!a || !b) continue;

  $("xp").firstElementChild.style.width = (100 * S.xp / S.need) + "%";

}
function hpBar(f) {

  ctx.fillStyle = "#0009"; ctx.fillRect(p.x - w / 2, p.y, w, 5); ctx.fillStyle = f.tier === "boss" ? "#ff8a1a" : "#d24a3c"; ctx.fillRect(p.x - w / 2, p.y, w * Math.max(0, f.hp / f.max), 5);

// ---------------------------------------------------------------------------------------------------------------------
const AUTO = location.search.includes("auto"), FF = +(new URLSearchParams(location.search).get("ff") || 0);
// (the bot keeps ?wear pieces on: upgrades first, then empty layers)
const botCard = (cards) => location.search.includes("wear=") ? (cards.find((c) => c.kind === "up") || cards.find((c) => !S.look[c.layer]) || cards[0]) : pick(cards);
if (AUTO) setInterval(() => { if (FF && S && S.picking) { if (S.mints) chooseMint(S.mints[0]); else if (S.cards) choose(botCard(S.cards)); } if (!S) return; if (S.picking && S.mints) chooseMint(S.mints[0]); else if (S.picking && S.cards) choose(S.cards[0]); const a = S.t * 0.8; keys.d = Math.cos(a) > 0.3; keys.a = Math.cos(a) < -0.3; keys.w = Math.sin(a) > 0.3; keys.s = Math.sin(a) < -0.3; }, 200);

addEventListener("keyup", (e) => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
